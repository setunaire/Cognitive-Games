<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cognitive Games — Launcher</title>
  <style>
    /* ---- Vazirmatn (bundled locally, used when Persian is selected) ---- */
    @font-face {
      font-family: 'Vazirmatn';
      src: url('fonts/Vazirmatn-Regular.ttf') format('truetype');
      font-weight: normal;
    }
    @font-face {
      font-family: 'Vazirmatn';
      src: url('fonts/Vazirmatn-Bold.ttf') format('truetype');
      font-weight: bold;
    }

    :root {
      --bg: #F4F6F8;
      --text: #212529;
      --muted: #6C757D;
      --accent: #3B5BDB;
      --accent-dark: #364FC7;
      --card-border: #DEE2E6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }
    body.fa { font-family: 'Vazirmatn', Tahoma, sans-serif; }

    h1 {
      color: var(--accent);
      font-size: 40px;
      margin: 0 0 6px;
    }
    p.subtitle {
      color: var(--muted);
      font-size: 17px;
      margin: 0 0 28px;
      text-align: center;
    }

    /* ---- Language switch ---- */
    .lang-switch {
      display: flex;
      gap: 0;
      margin-bottom: 28px;
      border: 2px solid var(--accent);
      border-radius: 12px;
      overflow: hidden;
    }
    .lang-switch button {
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      padding: 10px 34px;
      border: none;
      cursor: pointer;
      background: #FFFFFF;
      color: var(--accent);
      transition: background 0.15s ease, color 0.15s ease;
    }
    .lang-switch button.active {
      background: var(--accent);
      color: #FFFFFF;
    }
    .lang-switch button:not(.active):hover { background: #EDF2FF; }

    /* ---- Session Information panel (entered ONCE, reused by every game) ---- */
    .session-panel {
      background: #FFFFFF;
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 20px 26px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 560px;
    }
    .session-panel h3 {
      margin: 0 0 4px;
      font-size: 18px;
      color: var(--accent);
    }
    .session-panel .hint {
      margin: 0 0 16px;
      font-size: 13px;
      color: var(--muted);
    }
    .session-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
    }
    .session-row label {
      flex: 0 0 42%;
      font-size: 15px;
      font-weight: 600;
      color: #37474F;
    }
    .session-row input,
    .session-row select {
      flex: 1;
      font-family: inherit;
      font-size: 15px;
      padding: 8px 12px;
      border: 2px solid #CED4DA;
      border-radius: 8px;
      outline: none;
      background: #FFFFFF;
      color: #212529;
      transition: border-color 0.15s ease;
    }
    .session-row input:focus,
    .session-row select:focus { border-color: var(--accent); }
    body.fa .session-row input,
    body.fa .session-row select { direction: ltr; text-align: start; }
    .session-status {
      font-size: 13px;
      font-weight: 600;
      margin-top: 4px;
    }
    .session-status.ok { color: #2F9E44; }
    .session-status.warn { color: #E8590C; }

    /* ---- Game grid ---- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 22px;
      width: 100%;
      max-width: 940px;
    }
    a.card {
      display: block;
      background: #FFFFFF;
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 22px 24px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    }
    a.card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(59, 91, 219, 0.15);
    }
    /* Cards are disabled until Session Information is complete */
    .grid.locked a.card {
      opacity: 0.5;
      pointer-events: none;
      filter: grayscale(0.4);
    }
    .card .num {
      display: inline-block;
      background: var(--accent);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 14px;
      width: 28px;
      height: 28px;
      line-height: 28px;
      text-align: center;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .card h2 {
      margin: 0 0 6px;
      font-size: 21px;
      color: var(--text);
    }
    .card p {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
    }

    footer {
      margin-top: 44px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1 id="title"></h1>
  <p class="subtitle" id="subtitle"></p>

  <div class="lang-switch">
    <button id="btnEn" onclick="setLang('en')">English</button>
    <button id="btnFa" onclick="setLang('fa')">فارسی</button>
  </div>

  <!-- Session Information: entered once here, stored, and reused by every game -->
  <div class="session-panel">
    <h3 id="sessionTitle"></h3>
    <p class="hint" id="sessionHint"></p>
    <div class="session-row">
      <label id="lblPart" for="inPart"></label>
      <select id="inPart"></select>
    </div>
    <div class="session-row">
      <label id="lblSess" for="inSess"></label>
      <select id="inSess"></select>
    </div>
    <div class="session-status" id="sessionStatus"></div>
  </div>

  <div class="grid" id="grid"></div>

  <footer id="footer"></footer>

  <script src="experiment.js"></script>
  <script>
    /* =====================================================================
       CogGames launcher
       - The language switch decides which tree (Games_EN / Games_FA) the game
         cards link into, and localizes the launcher page itself.
       - Session Information (participant number + session number) is chosen
         ONCE here from fixed lists and stored in sessionStorage (NOT
         localStorage — see loadSession()) under 'cogGamesSession'. Each game
         reads it and skips its own metadata form. Cards stay locked until
         both are chosen.
       - The music condition is NO LONGER chosen by hand: experiment.js derives
         it from the session's fixed schedule and this participant's game order.
       - Cards are shown in this participant's assigned play order, numbered
         1..6, so the order is unambiguous without an experimenter present.
       ===================================================================== */

    const GAMES = [
      { folder: '1_Simon',
        en: { name: 'Simon Task',           desc: 'Spatial stimulus-response compatibility and attentional control' },
        fa: { name: 'آزمون سایمون',          desc: 'همخوانی مکانی محرک-پاسخ و کنترل توجه' } },
      { folder: '2_GoNoGo',
        en: { name: 'Go / No-Go',           desc: 'Response inhibition, sustained attention, signal detection' },
        fa: { name: 'آزمون برو/نرو',         desc: 'بازداری پاسخ، توجه پایدار و تشخیص علامت' } },
      { folder: '3_MemoryMatrix',
        en: { name: 'Memory Matrix',        desc: 'Visuospatial working memory, pattern encoding and recall' },
        fa: { name: 'ماتریس حافظه',          desc: 'حافظه کاری دیداری-فضایی، رمزگذاری و یادآوری الگو' } },
      { folder: '4_StarSearch',
        en: { name: 'Star Search',          desc: 'Visual selective attention: feature pop-out and conjunction search' },
        fa: { name: 'جستجوی ستاره',          desc: 'توجه انتخابی دیداری: جستجوی ویژگی و جستجوی ترکیبی' } },
      { folder: '5_BrainShift',
        en: { name: 'Brain Shift',          desc: 'Cognitive flexibility, task switching, executive control' },
        fa: { name: 'جابه‌جایی ذهنی',         desc: 'انعطاف‌پذیری شناختی، تغییر تکلیف و کنترل اجرایی' } },
      { folder: '6_ChalkboardChallenge',
        en: { name: 'Chalkboard Challenge', desc: 'Mental arithmetic, numerical processing, executive function' },
        fa: { name: 'چالش تخته‌سیاه',         desc: 'محاسبه ذهنی، پردازش عددی و عملکرد اجرایی' } }
    ];

    const PAGE_STRINGS = {
      en: {
        title: 'Cognitive Games',
        subtitle: 'Evaluation of Unconscious Effect of Music on Cognitive Functions — play the games in the numbered order',
        dir: 'ltr', tree: 'Games_EN', htmlLang: 'en',
        sessionTitle: 'Session Information',
        sessionHint: 'Choose these once. Every game will use them — you will not be asked again.',
        labelPart: 'Participant number', labelSess: 'Session number',
        selectPrompt: '— select —',
        statusOk: '✓ Saved — play the games in the numbered order, starting with 1.',
        statusWarn: 'Choose both numbers to unlock the games.',
        footer: 'Play the games in the order shown, from 1 to 6.'
      },
      fa: {
        title: 'بازی‌های شناختی',
        subtitle: 'ارزیابی اثر ناآگاهانه موسیقی بر عملکردهای شناختی — بازی‌ها را به ترتیب شماره انجام دهید',
        dir: 'rtl', tree: 'Games_FA', htmlLang: 'fa',
        sessionTitle: 'اطلاعات جلسه',
        sessionHint: 'این موارد را یک بار انتخاب کنید. همهٔ بازی‌ها از آن استفاده می‌کنند و دوباره پرسیده نمی‌شود.',
        labelPart: 'شمارهٔ شرکت‌کننده', labelSess: 'شمارهٔ جلسه',
        selectPrompt: '— انتخاب کنید —',
        statusOk: '✓ ذخیره شد — بازی‌ها را به ترتیب شماره و از شمارهٔ ۱ شروع کنید.',
        statusWarn: 'برای باز شدن بازی‌ها، هر دو شماره را انتخاب کنید.',
        footer: 'بازی‌ها را به ترتیب نمایش‌داده‌شده، از ۱ تا ۶ انجام دهید.'
      }
    };

    /* Persian digits for the FA interface. */
    function faDigits(str) {
      return String(str).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[+d]);
    }
    function localizeNum(n, lang) {
      return lang === 'fa' ? faDigits(n) : String(n);
    }

    let currentLang = localStorage.getItem('cogGamesLang') || 'en';

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('cogGamesLang', lang);
      render(lang);
    }

    // Deliberately sessionStorage, not localStorage: it must survive
    // navigating between games in the SAME sitting, but must NOT survive
    // closing the tab/browser — otherwise the launcher would silently
    // reopen pre-filled with yesterday's participant/session number.
    function loadSession() {
      try { return JSON.parse(sessionStorage.getItem('cogGamesSession')) || {}; }
      catch (e) { return {}; }
    }

    function saveSession() {
      const prev = loadSession();
      const sess = {
        participantId: document.getElementById('inPart').value.trim(),
        sessionId: document.getElementById('inSess').value.trim()
      };
      sessionStorage.setItem('cogGamesSession', JSON.stringify(sess));

      // A genuinely different participant/session pair starts a fresh session:
      // clear the stored music resume positions so its tracks begin at 0:00.
      // (Coming back to the launcher mid-session keeps the same pair, so
      // nothing is wiped between games.)
      const changed = sess.participantId !== (prev.participantId || '') ||
                      sess.sessionId !== (prev.sessionId || '');
      if (changed && sess.participantId && sess.sessionId) {
        CogGamesExperiment.resetSessionMusic(sess.participantId, sess.sessionId);
      }

      render(currentLang);   // re-number/re-order the cards for this participant
    }

    function sessionComplete() {
      const s = loadSession();
      return !!(s.participantId && s.sessionId);
    }

    function refreshLock() {
      const S = PAGE_STRINGS[currentLang];
      const ok = sessionComplete();
      document.getElementById('grid').classList.toggle('locked', !ok);
      const st = document.getElementById('sessionStatus');
      st.textContent = ok ? S.statusOk : S.statusWarn;
      st.className = 'session-status ' + (ok ? 'ok' : 'warn');
    }

    function render(lang) {
      const S = PAGE_STRINGS[lang];
      document.documentElement.lang = S.htmlLang;
      document.documentElement.dir = S.dir;
      document.body.classList.toggle('fa', lang === 'fa');

      document.getElementById('title').textContent = S.title;
      document.getElementById('subtitle').textContent = S.subtitle;
      document.getElementById('footer').textContent = S.footer;
      document.getElementById('btnEn').classList.toggle('active', lang === 'en');
      document.getElementById('btnFa').classList.toggle('active', lang === 'fa');

      // Session panel labels
      document.getElementById('sessionTitle').textContent = S.sessionTitle;
      document.getElementById('sessionHint').textContent = S.sessionHint;
      document.getElementById('lblPart').textContent = S.labelPart;
      document.getElementById('lblSess').textContent = S.labelSess;

      const stored = loadSession();

      // Participant / session number pickers (rebuilt so the prompt is
      // localized and the digits follow the interface language).
      fillNumberSelect('inPart', CogGamesExperiment.PARTICIPANT_IDS,
                       stored.participantId || '', S.selectPrompt, lang);
      fillNumberSelect('inSess', CogGamesExperiment.SESSION_IDS,
                       stored.sessionId || '', S.selectPrompt, lang);

      // Build cards IN THIS PARTICIPANT'S PLAY ORDER, numbered 1..6.
      // Before a participant is chosen, the canonical order is shown.
      const order = stored.participantId
        ? CogGamesExperiment.orderFor(stored.participantId)
        : CogGamesExperiment.GAMES;

      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      order.forEach((entry, i) => {
        const g = GAMES.find(x => x.folder === entry.folder);
        const a = document.createElement('a');
        a.className = 'card';
        a.href = `${S.tree}/${g.folder}/index.html`;
        a.addEventListener('click', (ev) => {
          if (!sessionComplete()) { ev.preventDefault(); refreshLock(); }
        });
        const num = document.createElement('span');
        num.className = 'num';
        num.textContent = localizeNum(i + 1, lang);
        const h2 = document.createElement('h2');
        h2.textContent = g[lang].name;
        const p = document.createElement('p');
        p.textContent = g[lang].desc;
        a.append(num, h2, p);
        grid.appendChild(a);
      });

      refreshLock();
    }

    /* Populate a number picker, preserving the stored selection. */
    function fillNumberSelect(id, values, selected, prompt, lang) {
      const sel = document.getElementById(id);
      sel.innerHTML = '';
      const opt0 = document.createElement('option');
      opt0.value = ''; opt0.textContent = prompt;
      sel.appendChild(opt0);
      for (const v of values) {
        const o = document.createElement('option');
        o.value = v; o.textContent = localizeNum(v, lang);
        sel.appendChild(o);
      }
      sel.value = selected;
    }

    // Persist on every change
    ['inPart', 'inSess'].forEach(id =>
      document.getElementById(id).addEventListener('change', saveSession));

    render(currentLang);
  </script>
</body>
</html>
